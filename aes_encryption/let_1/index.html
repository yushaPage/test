<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AES File Encryptor</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#151a28;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    box-sizing:border-box;
}

.box{
    width:100%;
    max-width:700px;
    background:#1d2335;
    border:1px solid #303955;
    border-radius:20px;
    padding:25px;
    box-sizing:border-box;
}

h1{
    margin-top:0;
    text-align:center;
    margin-bottom:25px;
}

.label{
    margin-top:18px;
    margin-bottom:8px;
    color:#cfd3e6;
    font-size:14px;
}

input{
    width:100%;
    box-sizing:border-box;
    background:#151a28;
    border:1px solid #3c4563;
    color:white;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    outline:none;
}

.file-input{
    padding:12px;
}

button{
    width:100%;
    margin-top:24px;
    border:none;
    background:#5a4bd6;
    color:white;
    padding:15px;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.92;
}

.status{
    margin-top:20px;
    color:#aab2d3;
    word-break:break-word;
    font-size:14px;
}

</style>
</head>
<body>

<div class="box">

    <h1>AES-256 File Encryptor</h1>

    <div class="label">Password</div>
    <input
        type="password"
        id="password"
        placeholder="Enter secret password"
    >

    <div class="label">Select Image or Video</div>
    <input
        type="file"
        id="fileInput"
        class="file-input"
    >

    <button onclick="encryptFile()">
        Encrypt & Download .aes
    </button>

    <div class="status" id="status"></div>

</div>

<script>

async function getKey(password, salt){

    const encoder = new TextEncoder();

    const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        { name:"PBKDF2" },
        false,
        ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name:"PBKDF2",
            salt:salt,
            iterations:100000,
            hash:"SHA-256"
        },
        keyMaterial,
        {
            name:"AES-GCM",
            length:256
        },
        false,
        ["encrypt"]
    );
}

function downloadFile(data, filename){

    const blob = new Blob([data]);

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}

async function encryptFile(){

    try{

        const file =
            document.getElementById("fileInput").files[0];

        const password =
            document.getElementById("password").value;

        if(!file){
            alert("Select a file");
            return;
        }

        if(!password){
            alert("Enter password");
            return;
        }

        const status =
            document.getElementById("status");

        status.innerText = "Reading file...";

        const fileBuffer =
            await file.arrayBuffer();

        status.innerText = "Generating encryption key...";

        const salt =
            crypto.getRandomValues(
                new Uint8Array(16)
            );

        const iv =
            crypto.getRandomValues(
                new Uint8Array(12)
            );

        const key =
            await getKey(password, salt);

        status.innerText = "Encrypting file...";

        const encrypted =
            await crypto.subtle.encrypt(
                {
                    name:"AES-GCM",
                    iv:iv
                },
                key,
                fileBuffer
            );

        const nameBytes =
            new TextEncoder().encode(file.name);

        const nameLength =
            new Uint16Array([nameBytes.length]);

        const combined =
            new Uint8Array(
                2 +
                nameBytes.length +
                16 +
                12 +
                encrypted.byteLength
            );

        let offset = 0;

        combined.set(
            new Uint8Array(nameLength.buffer),
            offset
        );

        offset += 2;

        combined.set(nameBytes, offset);

        offset += nameBytes.length;

        combined.set(salt, offset);

        offset += 16;

        combined.set(iv, offset);

        offset += 12;

        combined.set(
            new Uint8Array(encrypted),
            offset
        );

        status.innerText = "Preparing download...";

        downloadFile(
            combined,
            file.name + ".aes"
        );

        status.innerText =
            "File encrypted successfully";

    }catch(err){

        console.error(err);

        alert("Encryption failed");
    }
}

</script>

</body>
</html>
