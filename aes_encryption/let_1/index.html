<!DOCTYPE html>
<html>
<head>
  <title>Image Encrypt Decrypt</title>
  <style>
    body{
      font-family:Arial;
      padding:20px;
    }

    img{
      max-width:300px;
      margin-top:20px;
      border:1px solid #ccc;
    }

    button{
      margin-top:10px;
      padding:10px 20px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<h2>Encrypt & Decrypt Image</h2>

<input type="file" id="imageFile">
<br>

<button onclick="encryptImage()">Encrypt Image</button>
<button onclick="decryptImage()">Decrypt Image</button>

<h3>Decrypted Image Preview</h3>
<img id="preview">

<script>

const PASSWORD = "k1GOScEK5B";

let savedSalt;
let savedIV;

async function getKey(password, salt) {

    const encoder = new TextEncoder();

    const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: salt,
            iterations: 100000,
            hash: "SHA-256"
        },
        keyMaterial,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["encrypt", "decrypt"]
    );
}
async function encryptImage() {
        
        const file = document.getElementById("imageFile").files[0];
        
        if (!file) {
            alert("Select image first");
            return;
        }
        
        const data = await file.arrayBuffer();
        
        savedSalt = crypto.getRandomValues(new Uint8Array(16));
        savedIV = crypto.getRandomValues(new Uint8Array(12));
        
        const key = await getKey(PASSWORD, savedSalt);
        
        const encrypted = await crypto.subtle.encrypt(
            {
                name: "AES-GCM",
                iv: savedIV
            },
            key,
            data
        );
        const blob = new Blob([encrypted]);
   
   const a = document.createElement("a");
   
   a.href = URL.createObjectURL(blob);
   a.download = "image_file.enc";
   a.click();
   
   alert("Image encrypted and downloaded");
   }
   
   async function decryptImage() {
           
           const file = document.getElementById("imageFile").files[0];
           
           if (!file) {
               alert("Select encrypted file first");
               return;
           }
           const encryptedData = await file.arrayBuffer();

const key = await getKey(PASSWORD, savedSalt);

try {
    
    const decrypted = await crypto.subtle.decrypt(
        {
            name: "AES-GCM",
            iv: savedIV
        },
        key,
        encryptedData
    );
    
    const blob = new Blob([decrypted], {
        type: "image/jpeg"
    });
    
    const url = URL.createObjectURL(blob);
    
    document.getElementById("preview").src = url;
    
    const a = document.createElement("a");
    a.href = url;
        a.download = "image_file.jpg";
        a.click();

    }
    catch(err) {
        alert("Wrong password or invalid file");
        console.error(err);
    }
}

</script>

</body>
</html>
