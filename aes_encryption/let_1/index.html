<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AES File Encryptor</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#151a28;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    box-sizing:border-box;
}

.box{
    width:100%;
    max-width:700px;
    background:#1d2335;
    border:1px solid #303955;
    border-radius:20px;
    padding:25px;
}

h1{
    text-align:center;
    margin-top:0;
}

.label{
    margin-top:18px;
    margin-bottom:8px;
    color:#cfd3e6;
    font-size:14px;
}

input{
    width:100%;
    box-sizing:border-box;
    background:#151a28;
    border:1px solid #3c4563;
    color:white;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    outline:none;
}

button{
    width:100%;
    margin-top:24px;
    border:none;
    background:#5a4bd6;
    color:white;
    padding:15px;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

.status{
    margin-top:18px;
    color:#aab2d3;
    font-size:14px;
    word-break:break-word;
}
</style>
</head>
<body>

<div class="box">

<h1>AES-256 Encryptor</h1>

<div class="label">Password</div>
<input type="password" id="password" placeholder="Enter password">

<div class="label">Select File (Image / Video / Any)</div>
<input type="file" id="fileInput">

<button onclick="encryptFile()">Encrypt & Download .aes</button>

<div class="status" id="status"></div>

</div>

<script>

// ---------- KEY GENERATION ----------
async function getKey(password, salt){

    const enc = new TextEncoder();

    const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: salt,
            iterations: 100000,
            hash: "SHA-256"
        },
        keyMaterial,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["encrypt"]
    );
}

// ---------- FIXED DOWNLOAD FUNCTION ----------
function downloadFile(data, filename){

    const blob = new Blob([data], {
        type: "application/octet-stream"
    });

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);
}

// ---------- ENCRYPT ----------
async function encryptFile(){

    try{

        const file = document.getElementById("fileInput").files[0];
        const password = document.getElementById("password").value;
        const status = document.getElementById("status");

        if(!file){
            alert("Select a file");
            return;
        }

        if(!password){
            alert("Enter password");
            return;
        }

        status.innerText = "Reading file...";

        const fileBuffer = await file.arrayBuffer();

        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));

        status.innerText = "Generating key...";

        const key = await getKey(password, salt);

        status.innerText = "Encrypting...";

        const encrypted = await crypto.subtle.encrypt(
            {
                name: "AES-GCM",
                iv: iv
            },
            key,
            fileBuffer
        );

        const nameBytes = new TextEncoder().encode(file.name);
        const nameLen = new Uint16Array([nameBytes.length]);

        const combined = new Uint8Array(
            2 + nameBytes.length + 16 + 12 + encrypted.byteLength
        );

        let offset = 0;

        combined.set(new Uint8Array(nameLen.buffer), offset);
        offset += 2;

        combined.set(nameBytes, offset);
        offset += nameBytes.length;

        combined.set(salt, offset);
        offset += 16;

        combined.set(iv, offset);
        offset += 12;

        combined.set(new Uint8Array(encrypted), offset);

        status.innerText = "Downloading encrypted file...";

        // 🔥 FIXED: clean .aes output
        downloadFile(combined, file.name + ".aes");

        status.innerText = "Done ✔ File encrypted";

    }catch(err){
        console.error(err);
        alert("Encryption failed");
    }
}

</script>

</body>
</html>
