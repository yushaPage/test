<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Guard | Secure XOR Encryption</title>
  <style>
    :root {
      --bg-color: #0b0b0b;
      --card-bg: #1e1e1e;
      --accent-blue: #0078d4;
      --accent-hover: #005a9e;
      --text-main: #ffffff;
      --text-dim: #a1a1a1;
      --border-color: #333333;
      --error-red: #ff5f5f;
    }

    body { 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      margin: 0; 
      background-color: var(--bg-color); 
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 { 
      font-weight: 600; 
      letter-spacing: -0.5px;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #fff, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Toggle Navigation */
    .toggle-buttons { 
      background: var(--card-bg);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
    }

    .toggle-buttons button {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 10px 24px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .toggle-buttons button:hover {
      color: #fff;
    }

    .toggle-buttons button.active {
      background: var(--accent-blue);
      color: white;
    }

    /* Main Container */
    .section { 
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 30px; 
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 { margin-top: 0; font-size: 1.2rem; color: var(--text-dim); margin-bottom: 20px; }

    /* Drop Zone Style */
    .drop-zone {
      border: 2px dashed #444; 
      padding: 40px 20px; 
      text-align: center;
      cursor: pointer; 
      background: #252525;
      border-radius: 12px;
      transition: border-color 0.3s, background 0.3s;
    }

    .drop-zone:hover {
      border-color: var(--accent-blue);
      background: #2a2a2a;
    }

    .drop-zone p { color: var(--text-dim); margin-bottom: 20px; margin-top: 0;}

    /* Custom File Upload Styling */
    .file-upload-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .custom-file-btn {
      background: #333;
      color: white;
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .custom-file-btn:hover {
      background: #444;
      border-color: #555;
    }

    .file-name-display {
      font-size: 0.85rem;
      color: var(--accent-blue);
      font-style: italic;
      word-break: break-all;
    }

    /* Inputs & Buttons */
    textarea { 
      width: 100%; 
      height: 100px; 
      margin-top: 15px; 
      background: #121212;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #00ff41; /* Terminal green for data */
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      resize: vertical;
      box-sizing: border-box;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    button { 
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 12px 24px; 
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: #333;
      border: 1px solid var(--border-color);
    }
    
    .btn-secondary:hover {
      background: #444;
    }

    /* Previews */
    img { 
      max-width: 100%; 
      border-radius: 12px; 
      margin-top: 20px; 
      border: 1px solid var(--border-color); 
      display: none; 
    }

    #encActions, #decResult { 
      text-align: center; 
      margin-top: 20px; 
    }

    #decResult {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 30px;
        border-radius: 16px;
        max-width: 600px;
        width: 100%;
    }

    #errorMsg { color: var(--error-red); font-weight: 500; margin-top: 15px; text-align: center;}
  </style>
</head>
<body>

  <h1>Vault Crypt</h1>

  <!-- Toggle Buttons -->
  <div class="toggle-buttons">
    <button id="btn-enc" onclick="uiShowSection('encrypt')">Encrypt Image</button>
    <button id="btn-dec" onclick="uiShowSection('decrypt')">Decrypt Text</button>
  </div>

  <!-- Encryption Section -->
  <div class="section" id="encryptSection">
    <h2>Secure Encryption</h2>
    <div class="drop-zone" id="encDropZone">
      <p>Drag image here or click to browse</p>
      
      <!-- Custom File Upload -->
      <div class="file-upload-wrapper">
        <label for="encFileInput" class="custom-file-btn">Choose Image File</label>
        <input type="file" id="encFileInput" accept="image/*" style="display: none;">
        <div id="encFileName" class="file-name-display"></div>
      </div>

      <textarea id="encPasteBox" placeholder="Or paste image data here..."></textarea>
    </div>
    <img id="encPreview">
    <div id="encActions" style="display: none;">
      <button onclick="encryptAndSave()">Encrypt & Download .TXT</button>
      <button class="btn-secondary" onclick="location.reload()">Reset</button>
    </div>
  </div>

  <!-- Decryption Section -->
  <div class="section" id="decryptSection">
    <h2>Secure Decryption</h2>
    <div class="drop-zone" id="decDropZone">
      <p>Drop your .TXT file here</p>
      
      <!-- Custom File Upload -->
      <div class="file-upload-wrapper">
        <label for="decFileInput" class="custom-file-btn">Choose .TXT File</label>
        <input type="file" id="decFileInput" accept=".txt" style="display: none;">
        <div id="decFileName" class="file-name-display"></div>
      </div>

      <textarea id="decPasteBox" placeholder="Or paste encrypted string here..."></textarea>
    </div>
    <button style="width:100%; margin-top: 20px;" onclick="decryptAndPreview()">Decrypt Now</button>
    <div id="errorMsg"></div>
  </div>

  <!-- Decryption Result -->
  <div id="decResult" style="display:none">
    <h2>Decrypted Result</h2>
    <img id="decPreview">
    <div style="margin-top:20px">
      <button class="btn-secondary" onclick="location.reload()">Process Another</button>
    </div>
  </div>

  <script>
    const KEY = "001"; // XOR key
    let base64Data = null;
    let encryptedText = null;
    let originalFileName = null;
    let encryptedFileName = null;

    // UI Wrapper for original showSection
    function uiShowSection(section) {
      showSection(section);
      document.getElementById('btn-enc').classList.toggle('active', section === 'encrypt');
      document.getElementById('btn-dec').classList.toggle('active', section === 'decrypt');
    }

    // Original Show section logic
    function showSection(section) {
      document.getElementById("encryptSection").style.display = (section === "encrypt") ? "block" : "none";
      document.getElementById("decryptSection").style.display = (section === "decrypt") ? "block" : "none";
      document.getElementById("decResult").style.display = "none";
    }
    
    // Initial State
    uiShowSection("decrypt");

    // XOR function (Logic Unchanged)
    function xorEncrypt(str, keyStr) {
      let result = "";
      for (let i = 0; i < str.length; i++) {
        result += String.fromCharCode(str.charCodeAt(i) ^ keyStr.charCodeAt(i % keyStr.length));
      }
      return result;
    }

    // --- Encryption Section ---
    document.getElementById("encFileInput").addEventListener("change", e => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById("encFileName").textContent = file.name;
        readImageFile(file);
      }
    });

    const encDropZone = document.getElementById("encDropZone");
    encDropZone.addEventListener("dragover", e => { e.preventDefault(); encDropZone.style.borderColor="var(--accent-blue)"; });
    encDropZone.addEventListener("dragleave", e => { encDropZone.style.borderColor="#444"; });
    encDropZone.addEventListener("drop", e => {
      e.preventDefault(); encDropZone.style.borderColor="#444";
      const file = e.dataTransfer.files[0];
      if (file) {
        document.getElementById("encFileName").textContent = file.name;
        readImageFile(file);
      }
    });

    document.addEventListener("paste", e => {
      const items = e.clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
          const file = items[i].getAsFile();
          if (file) {
            document.getElementById("encFileName").textContent = "Pasted Image";
            readImageFile(file);
          }
        }
      }
    });

    function readImageFile(file) {
      originalFileName = file.name.replace(/\./g, "_");
      const reader = new FileReader();
      reader.onload = function() {
        const preview = document.getElementById("encPreview");
        preview.src = reader.result;
        preview.style.display = "block";
        base64Data = reader.result.split(",")[1];
        encryptedText = null;
        document.getElementById("encDropZone").style.display = "none";
        document.getElementById("encActions").style.display = "block";
      };
      reader.readAsDataURL(file);
    }

    function encryptAndSave() {
      if (!base64Data) return alert("No image loaded!");
      encryptedText = xorEncrypt(base64Data, KEY);
      encryptedFileName = `${originalFileName}_001_enc.txt`;
      const blob = new Blob([encryptedText], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = encryptedFileName;
      a.click();
    }

    // --- Decryption Section ---
    document.getElementById("decFileInput").addEventListener("change", e => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById("decFileName").textContent = file.name;
        readEncryptedFile(file);
      }
    });

    const decDropZone = document.getElementById("decDropZone");
    decDropZone.addEventListener("dragover", e => { e.preventDefault(); decDropZone.style.borderColor="var(--accent-blue)"; });
    decDropZone.addEventListener("dragleave", e => { decDropZone.style.borderColor="#444"; });
    decDropZone.addEventListener("drop", e => {
      e.preventDefault(); decDropZone.style.borderColor="#444";
      const file = e.dataTransfer.files[0];
      if (file) {
        document.getElementById("decFileName").textContent = file.name;
        readEncryptedFile(file);
      }
    });

    function readEncryptedFile(file) {
      encryptedFileName = file.name;
      const reader = new FileReader();
      reader.onload = function() {
        encryptedText = reader.result;
        // Optionally auto-decrypt on load, or wait for button click:
        // decryptAndPreview(); 
      };
      reader.readAsText(file);
    }

    function decryptAndPreview() {
      try {
        if (!encryptedText) {
          const pasted = document.getElementById("decPasteBox").value.trim();
          if (!pasted) throw new Error("Please upload a file or paste text!");
          encryptedText = pasted;
          encryptedFileName = "pasted_001_enc.txt";
        }

        const decryptedBase64 = xorEncrypt(encryptedText, KEY);
        if (!decryptedBase64 || decryptedBase64.length < 10) throw new Error("Decryption failed! Check your key or file.");

        const preview = document.getElementById("decPreview");
        preview.src = "data:image/png;base64," + decryptedBase64;
        preview.style.display = "block";
        document.getElementById("errorMsg").textContent = "";
        document.getElementById("decryptSection").style.display = "none";
        document.getElementById("decResult").style.display = "block";

        let originalName = encryptedFileName.replace("_001_enc.txt", "");
        preview.setAttribute("data-filename", originalName);

      } catch (err) {
        document.getElementById("errorMsg").textContent = err.message;
      }
    }
  </script>
</body>
</html>
