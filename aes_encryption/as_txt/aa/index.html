<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Encrypt/Decrypt (Base64 + XOR)</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
    .drop-zone {
      border: 2px dashed #666; padding: 20px; margin: 20px auto; width: 300px;
      cursor: pointer; background: #f9f9f9;
    }
    img { max-width: 300px; margin-top: 20px; border: 1px solid #ccc; }
    button { margin: 10px; padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>Encrypt / Decrypt Image</h1>

  <!-- File input -->
  <input type="file" id="fileInput" accept="image/*"><br>

  <!-- Drag & Drop -->
  <div class="drop-zone" id="dropZone">Drag & Drop Image Here</div>

  <!-- Preview -->
  <img id="preview" alt="Preview will appear here">

  <!-- Buttons -->
  <div>
    <button onclick="encryptAndSave()">Encrypt & Save as TXT</button>
    <button onclick="decryptAndSave()">Decrypt & Save Image</button>
  </div>

  <script>
    const KEY = "001"; // XOR key
    let base64Data = null; // store Base64 of image
    let encryptedText = null; // store encrypted text

    // Handle file input
    document.getElementById("fileInput").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (file) readFile(file);
    });

    // Handle drag & drop
    const dropZone = document.getElementById("dropZone");
    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.style.background="#eef"; });
    dropZone.addEventListener("dragleave", e => { dropZone.style.background="#f9f9f9"; });
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.style.background="#f9f9f9";
      const file = e.dataTransfer.files[0];
      if (file) readFile(file);
    });

    // Read file and show preview
    function readFile(file) {
      const reader = new FileReader();
      reader.onload = function() {
        // Preview image
        document.getElementById("preview").src = reader.result;
        // Store Base64 data (strip "data:image/...;base64,")
        base64Data = reader.result.split(",")[1];
        encryptedText = null; // reset
      };
      reader.readAsDataURL(file);
    }

    // XOR encryption
    function xorEncrypt(str, keyStr) {
      let result = "";
      for (let i = 0; i < str.length; i++) {
        result += String.fromCharCode(str.charCodeAt(i) ^ keyStr.charCodeAt(i % keyStr.length));
      }
      return result;
    }

    // Encrypt and save as TXT
    function encryptAndSave() {
      if (!base64Data) return alert("No image loaded!");
      encryptedText = xorEncrypt(base64Data, KEY);
      const blob = new Blob([encryptedText], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "encrypted.txt";
      a.click();
    }

    // Decrypt and save image
    function decryptAndSave() {
      if (!encryptedText) return alert("No encrypted text available! Encrypt first.");
      const decryptedBase64 = xorEncrypt(encryptedText, KEY);
      const imgBytes = atob(decryptedBase64);
      const byteArray = new Uint8Array(imgBytes.length);
      for (let i = 0; i < imgBytes.length; i++) {
        byteArray[i] = imgBytes.charCodeAt(i);
      }
      const blob = new Blob([byteArray], { type: "image/png" }); // default PNG
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "decrypted.png";
      a.click();
    }
  </script>
</body>
</html>
