<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AES-GCM Image Encryption Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .section { margin-bottom: 20px; }
    img { max-width: 300px; display: block; margin-top: 10px; }
    textarea { width: 100%; height: 120px; }
    button { margin-right: 10px; padding: 8px 12px; }
    pre { background: #f0f0f0; padding: 10px; }
  </style>
</head>
<body>
  <h1>AES-GCM Image Encryption & Decryption</h1>

  <div class="section">
    <h2>Step 1: Encrypt an Image</h2>
    <input type="file" id="fileInput" accept="image/*">
    <button onclick="encryptImage()">Encrypt</button>
    <button onclick="downloadEncrypted()">Download .bin</button>
  </div>

  <div class="section">
    <h2>Original Image</h2>
    <img id="originalImg">
  </div>

  <div class="section">
    <h2>Ciphertext Storage (Base64)</h2>
    <textarea id="ciphertextBox" readonly></textarea>
  </div>

  <div class="section">
    <h2>Encryption Details</h2>
    <pre id="detailsBox"></pre>
  </div>

  <hr>

  <div class="section">
    <h2>Step 2: Load & Decrypt Saved .bin File</h2>
    <input type="file" id="binInput" accept=".bin">
    <button onclick="decryptBinFile()">Decrypt .bin</button>
  </div>

  <div class="section">
    <h2>Decrypted Image</h2>
    <img id="decryptedImg">
  </div>

<script>
let key;        // CryptoKey object
let fileType;   // Original MIME type
let combined;   // IV + ciphertext combined

// Convert fixed key string into 32-byte Uint8Array
async function importFixedKey() {
  const keyString = "1a2aa3aaa4aaaa5aaaaa6aaaaaa7aaaa";
  const encoder = new TextEncoder();
  let keyBytes = encoder.encode(keyString);

  if (keyBytes.length < 32) {
    const padded = new Uint8Array(32);
    padded.set(keyBytes);
    keyBytes = padded;
  } else if (keyBytes.length > 32) {
    keyBytes = keyBytes.slice(0, 32);
  }

  key = await crypto.subtle.importKey(
    "raw",
    keyBytes,
    { name: "AES-GCM" },
    false,
    ["encrypt", "decrypt"]
  );
}
importFixedKey();

// Helpers for Base64 conversion
function arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const len = bytes.byteLength;
  for (let i = 0; i < len; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

// Handle file selection for original image
document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (file) {
    fileType = file.type;
    const url = URL.createObjectURL(file);
    document.getElementById("originalImg").src = url;
  }
});

// Encrypt image file
async function encryptImage() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Select an image first!");

  const buffer = await file.arrayBuffer();
  const iv = crypto.getRandomValues(new Uint8Array(12));

  const ciphertext = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv },
    key,
    buffer
  );

  // Combine IV + ciphertext
  combined = new Uint8Array(iv.length + ciphertext.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(ciphertext), iv.length);

  document.getElementById("ciphertextBox").value = arrayBufferToBase64(combined);

  // Show encryption details
  document.getElementById("detailsBox").textContent =
    "Initialization Vector (IV): " + Array.from(iv).map(b => b.toString(16).padStart(2, '0')).join(' ') +
    "\nCiphertext length: " + ciphertext.byteLength + " bytes";

  alert("Image encrypted successfully!");
}

// Download encrypted data as .bin
function downloadEncrypted() {
  if (!combined) return alert("No encrypted data to download!");
  const blob = new Blob([combined], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "encrypted.bin";
  a.click();
  URL.revokeObjectURL(url);
}

// Decrypt from saved .bin file
async function decryptBinFile() {
  const file = document.getElementById("binInput").files[0];
  if (!file) return alert("Select an encrypted .bin file first!");

  const buffer = await file.arrayBuffer();
  const combinedArr = new Uint8Array(buffer);
  const iv = combinedArr.slice(0, 12);
  const data = combinedArr.slice(12);

  try {
    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv },
      key,
      data
    );

    const blob = new Blob([decrypted], { type: fileType || "image/png" });
    const url = URL.createObjectURL(blob);
    document.getElementById("decryptedImg").src = url;

    alert("Image decrypted successfully!");
  } catch (err) {
    alert("Decryption failed: " + err.message);
  }
}
</script>
</body>
</html>
