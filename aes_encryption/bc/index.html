<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Video Stream</title>
  <style>
    /* Dark Cinematic Minimalist Interface */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Strict 2:3 Aspect Ratio Interface Box */
    .crypto-box {
      width: 90vw;
      max-width: 400px;
      height: 135vw;
      max-height: 600px; /* 400px x 600px matches exactly 2:3 */
      background-color: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 16px;
      box-sizing: border-box;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      z-index: 20;
    }

    .info-text {
      font-size: 1.1rem;
      color: #aaaaaa;
      margin-bottom: 30px;
      letter-spacing: 0.5px;
      line-height: 1.5;
      text-align: center;
    }

    button {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 16px 35px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s, background-color 0.2s;
      letter-spacing: 0.5px;
      width: 100%;
      box-sizing: border-box;
    }

    button:hover {
      transform: scale(1.02);
      background-color: #e6e6e6;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    .progress-wrapper {
      width: 100%;
      display: none;
    }

    .progress-bar {
      width: 100%;
      background-color: #222222;
      height: 4px;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: #ffffff;
      width: 0%;
      transition: width 0.1s linear;
    }

    .status {
      font-size: 0.8rem;
      color: #666666;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: center;
    }

    /* Video Workspace Framework for Variable Zooming */
    .video-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      justify-content: center;
      align-items: center;
      background: #000000;
      z-index: 10;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
      transition: transform 0.1s ease-out; /* Smooth zooming action */
    }
  </style>
</head>
<body>

  <!-- THE 2:3 CONTAINER INTERFACE -->
  <div id="interfaceBox" class="crypto-box">
    
    <!-- UI BEFORE PROCESSING -->
    <div id="setupUi" style="width: 100%; text-align: center;">
      <div id="fileInfo" class="info-text">Configuring secure channel properties...</div>
      <button id="actionBtn" onclick="fetchAndDecrypt()" disabled>Download & Play Video</button>
    </div>

    <!-- LOADING SCREEN -->
    <div id="progressWrapper" class="progress-wrapper">
      <div class="progress-bar">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
      <div id="status" class="status">Connecting...</div>
    </div>

  </div>

  <!-- VIDEO VIEWPORT WRAPPER (Handles Canvas Bounds) -->
  <div id="videoViewport" class="video-viewport">
    <video id="videoPlayer" controls controlsList="nodownload"></video>
  </div>

<script>
// Hidden Assets Configuration
const FILE_URL = "https://ik.imagekit.io/on3rlyw36/Yusha_766p.bin?updatedAt=1779028553339";
const FIXED_KEY_STRING = "1a2aa3aaa4aaaa5aaaaa6aaaaaa7aaaa";

// Cryptographic Layout Parameters
const CHUNK_SIZE = 1024 * 1024; 
const ENCRYPTED_CHUNK_SIZE = CHUNK_SIZE + 16; 

let cryptoKey;
let totalFileBytes = 0;

// Dynamic Scaling Variables
let currentScale = 1.0; 
const MIN_SCALE = 0.5;   // Zoom out up to 50% minimum screen boundary
const MAX_SCALE = 1.0;   // Zoom in up to 100% full screen fit boundary
const ZOOM_SPEED = 0.05; // Scaling increments per keystroke

// Page Initializer
async function init() {
  try {
    // Import WebCrypto Keys
    let keyBytes = new TextEncoder().encode(FIXED_KEY_STRING);
    if (keyBytes.length < 32) {
      const padded = new Uint8Array(32);
      padded.set(keyBytes);
      keyBytes = padded;
    } else if (keyBytes.length > 32) {
      keyBytes = keyBytes.slice(0, 32);
    }
    cryptoKey = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]);

    // Quietly pull media metadata size (HEAD method reads size instantly without file content download)
    const response = await fetch(FILE_URL, { method: 'HEAD' });
    if (!response.ok) throw new Error();

    const contentLength = response.headers.get('Content-Length');
    if (contentLength) {
      totalFileBytes = parseInt(contentLength, 10);
      const sizeMB = (totalFileBytes / (1024 * 1024)).toFixed(2);
      document.getElementById("fileInfo").textContent = `Secure Video Asset\n(${sizeMB} MB)`;
    } else {
      document.getElementById("fileInfo").textContent = "Secure Video Asset Ready";
    }
    document.getElementById("actionBtn").disabled = false;
  } catch (e) {
    const info = document.getElementById("fileInfo");
    info.textContent = "Configuration error. Check connection limits or CORS rules.";
    info.style.color = "#e74c3c";
  }
}
window.onload = init;

// Zoom Interaction Logic
function applyZoom(direction) {
  const video = document.getElementById("videoPlayer");
  
  if (direction === 'in') {
    currentScale = Math.min(MAX_SCALE, currentScale + ZOOM_SPEED);
  } else if (direction === 'out') {
    currentScale = Math.max(MIN_SCALE, currentScale - ZOOM_SPEED);
  }
  
  // Transform layout dynamically
  video.style.transform = `scale(${currentScale})`;
}

// Bind Keyboard Hotkeys for Zoom Management (+ / -)
window.addEventListener("keydown", (e) => {
  // Only handle zoom if the player view is currently active
  if (document.getElementById("videoViewport").style.display === "flex") {
    if (e.key === "+" || e.key === "=") {
      e.preventDefault();
      applyZoom('in');
    } else if (e.key === "-") {
      e.preventDefault();
      applyZoom('out');
    }
  }
});

// Stream Assembler Worker
function appendBuffer(buffer1, buffer2) {
  const tmp = new Uint8Array(buffer1.length + buffer2.length);
  tmp.set(buffer1, 0);
  tmp.set(buffer2, buffer1.length);
  return tmp;
}

// Processing Core Engine
async function fetchAndDecrypt() {
  const setupUi = document.getElementById("setupUi");
  const progressWrapper = document.getElementById("progressWrapper");
  const progressBar = document.getElementById("progressBar");
  const status = document.getElementById("status");
  const videoPlayer = document.getElementById("videoPlayer");
  const videoViewport = document.getElementById("videoViewport");
  const interfaceBox = document.getElementById("interfaceBox");

  // Toggle layouts inside the box 
  setupUi.style.display = "none";
  progressWrapper.style.display = "block";
  status.textContent = "Streaming Connection Initialized...";

  try {
    const response = await fetch(FILE_URL);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const reader = response.body.getReader();
    
    let loadedBytes = 0;
    let streamBuffer = new Uint8Array(0);
    let iv = null;
    const decryptedChunks = [];

    while (true) {
      const { done, value } = await reader.read();
      
      if (value) {
        loadedBytes += value.byteLength;
        streamBuffer = appendBuffer(streamBuffer, value);

        // Strip initial IV package
        if (!iv && streamBuffer.length >= 12) {
          iv = streamBuffer.slice(0, 12);
          streamBuffer = streamBuffer.slice(12);
        }

        // Loop process aligned blocks
        while (iv && streamBuffer.length >= ENCRYPTED_CHUNK_SIZE) {
          const chunkToDecrypt = streamBuffer.slice(0, ENCRYPTED_CHUNK_SIZE);
          streamBuffer = streamBuffer.slice(ENCRYPTED_CHUNK_SIZE);

          const decryptedBuffer = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv }, 
            cryptoKey, 
            chunkToDecrypt
          );
          decryptedChunks.push(new Uint8Array(decryptedBuffer));
        }

        // Render progress calculations
        if (totalFileBytes) {
          const percent = Math.min(100, Math.floor((loadedBytes / totalFileBytes) * 100));
          progressBar.style.width = percent + "%";
          status.textContent = `Decrypting: ${percent}%`;
        } else {
          status.textContent = `Streaming blocks...`;
        }
      }

      if (done) break;
    }

    // Process remainder bytes
    if (streamBuffer.length > 0) {
      const decryptedBuffer = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv }, 
        cryptoKey, 
        streamBuffer
      );
      decryptedChunks.push(new Uint8Array(decryptedBuffer));
    }

    // Mount player and delete control overlay completely
    const finalBlob = new Blob(decryptedChunks, { type: "video/mp4" });
    const videoUrl = URL.createObjectURL(finalBlob);
    
    interfaceBox.style.display = "none"; 
    videoViewport.style.display = "flex"; 
    videoPlayer.src = videoUrl;
    videoPlayer.play();

  } catch (error) {
    console.error(error);
    progressWrapper.style.display = "none";
    setupUi.style.display = "block";
    const info = document.getElementById("fileInfo");
    info.textContent = `Streaming Error: ${error.message}`;
    info.style.color = "#e74c3c";
  }
}
</script>
</body>
</html>
