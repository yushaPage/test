<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Box</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111827;
      font-family:Arial, sans-serif;
    }

    .box{
      background:#1f2937;
      color:white;
      padding:30px;
      border-radius:12px;
      font-size:24px;
      box-shadow:0 0 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="box">
    Hello World
  </div>

</body>
</html>
