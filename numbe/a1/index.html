<title>Number Grid</title>

        font-family: "Segoe UI", sans-serif;
        padding: 20px;
        text-align: center;
    }

    h2 {
        margin-bottom: 10px;
    }

    #count {
        margin-bottom: 20px;
        color: #94a3b8;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        max-width: 1000px;
        margin: auto;
    }

    .card {
        background: #1e293b;
        padding: 12px;
        border-radius: 8px;
        transition: 0.2s;
        word-break: break-all;
        font-size: 14px;
    }

    .card:hover {
        background: #334155;
    }

    .emoji {
        margin-left: 6px;
    }
</style>
</head>
